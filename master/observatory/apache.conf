<VirtualHost *:80>
    DocumentRoot /var/www/html/observatory

    <Directory /var/www/html/observatory>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /site /var/www/html/public
    RedirectMatch 301 ^/observatory/?(.*)$ /$1

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
