services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ad_astra_observatory
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./master/observatory/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./master/observatory/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./master:/var/www/html
      - ./master/observatory/apache.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ad_astra_observatory
      DB_USER: root
      DB_PASS: root
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground"

  node:
    image: node:20
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./master:/app
    command: node server.js

volumes:
  mysql_data:
